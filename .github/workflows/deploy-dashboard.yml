name: deploy-dashboard

# Ships dashboard code changes without waiting for tomorrow's scrape.
# The daily workflow deploys too, and that one carries fresh data; this one
# re-exports whatever catalog the last run left on the `data` branch.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages allows one deployment at a time; queue rather than fail.
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pages_enabled: ${{ steps.pages_check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore catalog and re-export
        # Without this the deployed bundle would ship no data at all.
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # An empty `data` branch is fine here: the bundle just ships without
          # a snapshot until the next daily run writes one.
          nippon-margin sync pull || echo "no stored catalog yet"
          nippon-margin export --out dashboard/public/data.json || echo "nothing to export yet"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build
        working-directory: dashboard
        env:
          VITE_REPO_SLUG: ${{ github.repository }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - name: Check GitHub Pages is enabled
        id: pages_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/configure-pages can *read* the Pages config but cannot
          # create it: GITHUB_TOKEN has no `administration: write`, and that
          # permission cannot be granted from the workflow. So enabling Pages
          # is a genuine one-time human step, and this turns the otherwise
          # cryptic "Resource not accessible by integration" into something
          # actionable.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Enable it once at https://github.com/${{ github.repository }}/settings/pages -- set Source to 'GitHub Actions'. Then re-run this workflow. Nothing else is needed."
          fi

      - uses: actions/configure-pages@v5
        if: ${{ steps.pages_check.outputs.enabled == 'true' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.pages_check.outputs.enabled == 'true' }}
        with:
          path: dashboard/dist

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages_enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
